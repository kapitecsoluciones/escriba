name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacidad:
    name: No prohibited private terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "PRIVATE_TERMS secret not set; skipping."
            exit 0
          fi
          fallo=0
          while IFS= read -r termino; do
            [ -z "$termino" ] && continue
            if grep -ri --exclude-dir=.git --exclude-dir=node_modules -l "$termino" . > /dev/null 2>&1; then
              echo "::error::Private term found in the tree: $termino"
              grep -ri --exclude-dir=.git --exclude-dir=node_modules -l "$termino" . | head -5
              fallo=1
            fi
          done <<< "$PRIVATE_TERMS"
          exit $fallo

  sintaxis:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check every JS file parses
        run: |
          fallo=0
          for f in main.js preload.js lib/*.js lib/motores/*.js renderer/*.js; do
            node --check "$f" || fallo=1
          done
          exit $fallo

  pruebas:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run the test suite
        run: node --test "test/*.test.js"

  nativo:
    name: Swift helper builds
    # macos-15 o superior: el capturador usa SCStreamConfiguration.captureMicrophone
    # y SCStreamOutputType.microphone, que solo existen en el SDK de macOS 15.
    # En macos-14 este job llevaba fallando desde que se creó.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the capture helper
        run: swiftc -O nativo/CapturaSistema.swift -o /tmp/capturasistema
      # Lo único del binario que se puede comprobar sin permisos de pantalla ni
      # de micrófono. El ciclo de captura real queda fuera de alcance del CI a
      # propósito: simularlo daría una prueba que pasa sin comprobar nada.
      - name: With no arguments it prints usage and exits with 2
        run: |
          salida=$(/tmp/capturasistema 2>&1) && codigo=0 || codigo=$?
          echo "$salida"
          if [ "$codigo" != "2" ]; then echo "::error::se esperaba código 2, llegó $codigo"; exit 1; fi
          echo "$salida" | grep -q "Uso: CapturaSistema" || { echo "::error::no imprimió el uso"; exit 1; }
