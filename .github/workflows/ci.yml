name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  privacidad:
    name: No prohibited private terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "PRIVATE_TERMS secret not set; skipping."
            exit 0
          fi
          fallo=0
          while IFS= read -r termino; do
            [ -z "$termino" ] && continue
            if grep -ri --exclude-dir=.git --exclude-dir=node_modules -l "$termino" . > /dev/null 2>&1; then
              echo "::error::Private term found in the tree: $termino"
              grep -ri --exclude-dir=.git --exclude-dir=node_modules -l "$termino" . | head -5
              fallo=1
            fi
          done <<< "$PRIVATE_TERMS"
          exit $fallo

  sintaxis:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check every JS file parses
        run: |
          fallo=0
          for f in main.js preload.js lib/*.js lib/motores/*.js renderer/*.js; do
            node --check "$f" || fallo=1
          done
          exit $fallo

  pruebas:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run the test suite
        run: node --test "test/*.test.js"

  nativo:
    name: Swift helper builds
    # macos-15 o superior: el capturador usa SCStreamConfiguration.captureMicrophone
    # y SCStreamOutputType.microphone, que solo existen en el SDK de macOS 15.
    # En macos-14 este job llevaba fallando desde que se creó.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the capture helper
        run: swiftc -O nativo/CapturaSistema.swift -o /tmp/capturasistema
      # Lo único del binario que se puede comprobar sin permisos de pantalla ni
      # de micrófono. El ciclo de captura real queda fuera de alcance del CI a
      # propósito: simularlo daría una prueba que pasa sin comprobar nada.
      - name: With no arguments it prints usage and exits with 2
        run: |
          salida=$(/tmp/capturasistema 2>&1) && codigo=0 || codigo=$?
          echo "$salida"
          if [ "$codigo" != "2" ]; then echo "::error::se esperaba código 2, llegó $codigo"; exit 1; fi
          echo "$salida" | grep -q "Uso: CapturaSistema" || { echo "::error::no imprimió el uso"; exit 1; }

  dmg:
    name: DMG builds (ad-hoc signed, verification only)
    # Minutos de runner macOS: no en cada PR. Lo que comprueba —que el
    # empaquetado sigue en pie— no cambia con cada commit.
    if: github.event_name != 'pull_request'
    # macos-15 fijo: arm64 nativo y SDK de macOS 15, que CapturaSistema.swift
    # necesita. macos-latest se movería a 26 sin que nadie toque este archivo.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm ANTES que setup-node: cache: 'pnpm' necesita el binario
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Cache the Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-15-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-macos-15-
      - run: pnpm install --frozen-lockfile
      # A nativo/capturasistema, que es lo que lee extraResources. El job
      # `nativo` compila a /tmp y electron-builder no lo ve.
      - name: Compile the capture helper
        run: pnpm run nativo
      - name: Build the DMG
        env:
          # En CI no existe el certificado de Escriba: build/firmar.js cae a
          # ad-hoc, que es lo que queremos aquí. Esto impide además que
          # electron-builder salga a buscar una identidad por su cuenta.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: en GitHub Actions electron-builder intenta subir el
        # artefacto a una release y pide GH_TOKEN. Este job solo verifica; la
        # release la crea el autor a mano con el .dmg firmado en su Mac.
        run: pnpm exec electron-builder --mac --arm64 --publish never
      - name: The DMG exists and is not a stub
        run: |
          v=$(node -p "require('./package.json').version"); dmg="dist/Escriba-${v}-arm64.dmg"
          [ -f "$dmg" ] || { echo "::error::no se generó $dmg"; ls -la dist; exit 1; }
          b=$(stat -f%z "$dmg"); [ "$b" -ge 50000000 ] || { echo "::error::$dmg pesa solo $b bytes"; exit 1; }
          echo "$dmg — $((b/1000000)) MB"
      - name: The capture helper travelled inside the .app, and is arm64
        run: |
          bin="dist/mac-arm64/Escriba.app/Contents/Resources/capturasistema"
          [ -x "$bin" ] || { echo "::error::falta $bin"; exit 1; }
          file "$bin" | grep -q arm64 || { echo "::error::no es arm64"; exit 1; }
      - name: The bundle identifier is pro.kapitec.escriba
        # comprueba el Info.plist, NO la firma: Identifier= sale igual en ad-hoc
        run: codesign -dv dist/mac-arm64/Escriba.app 2>&1 | grep -qx 'Identifier=pro.kapitec.escriba'
      - name: This build is ad-hoc signed, and must stay that way
        # El certificado propio existe para que el permiso de Grabación de
        # Pantalla sobreviva a las actualizaciones, y vive solo en la Mac del
        # autor. Si algún día alguien conecta un .p12 aquí, este paso se pone
        # rojo: que sea una decisión consciente, no un efecto secundario.
        run: |
          req=$(codesign -d -r- dist/mac-arm64/Escriba.app 2>/dev/null); echo "$req"
          if echo "$req" | grep -q 'certificate root'; then
            echo "::error::firmado con certificado. CI solo produce builds ad-hoc de verificación."; exit 1; fi
          codesign -dv dist/mac-arm64/Escriba.app 2>&1 | grep -q 'Signature=adhoc' || { echo "::error::se esperaba ad-hoc"; exit 1; }
          codesign --verify --strict --verbose=2 dist/mac-arm64/Escriba.app
      - name: The app.asar carries the current lib/
        # El .dmg de 0.6.1 se empaquetó ANTES de que existiera lib/memoria.js.
        run: |
          lista=$(pnpm dlx @electron/asar list dist/mac-arm64/Escriba.app/Contents/Resources/app.asar)
          fallo=0
          for f in /main.js /preload.js /lib/memoria.js /lib/preparacion.js /lib/atomico.js /lib/migracion.js /lib/minuta.js /renderer/app.js; do
            echo "$lista" | grep -qx -- "$f" || { echo "::error::falta $f en el app.asar"; fallo=1; }
          done
          exit $fallo
      - uses: actions/upload-artifact@v4
        with:
          # El nombre es la advertencia: instalar esto rompe el permiso de
          # grabación en la siguiente actualización. El .dmg real se publica a
          # mano desde la Mac del autor.
          name: escriba-dmg-sin-firmar-verificacion
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
