onlyBuiltDependencies:
  - electron

# pnpm 11 exige decidir cada script de build. electron-winstaller solo sirve
# para instaladores de Windows y el único destino es un .dmg: no se ejecuta.
# Sin esta decisión, `pnpm install --frozen-lockfile` falla en CI con
# ERR_PNPM_IGNORED_BUILDS. (Probadas ignoredBuiltDependencies y
# neverBuiltDependencies: pnpm 11.5 no las honra aquí; allowBuilds sí.)
allowBuilds:
  electron-winstaller: false
