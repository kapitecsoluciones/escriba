<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escriba</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca">
      <!-- el mismo glifo del icono (build/marca/icono.html): voz → texto -->
      <svg class="marca-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect width="64" height="64" rx="16" fill="#0A1428"/>
        <rect x="13"   y="27.8"  width="4.5" height="8.4"  rx="2.25" fill="#fff"/>
        <rect x="20.7" y="23.25" width="4.5" height="17.5" rx="2.25" fill="#fff"/>
        <rect x="28.4" y="18"    width="4.5" height="28"   rx="2.25" fill="#fff"/>
        <rect x="36.9" y="24.35" width="15"  height="3.5"  rx="1.75" fill="#B58A3E"/>
        <rect x="36.9" y="30.25" width="12"  height="3.5"  rx="1.75" fill="#B58A3E"/>
        <rect x="36.9" y="36.15" width="8.5" height="3.5"  rx="1.75" fill="#B58A3E"/>
      </svg>
      <div>
        <h1>Escriba</h1>
        <div class="marca-linea"></div>
      </div>
    </div>
    <div class="buscar"><input id="q" type="search" placeholder="Buscar en clientes y minutas" title="Un cliente por nombre, o cualquier cosa que se haya dicho en una reunión (⌘F)" autocomplete="off"></div>
    <button class="nuevo-cli" id="btnNuevoCliente" title="Crear un cliente (⌘N)">+ Nuevo cliente</button>
    <div class="lista" id="clientes"></div>
    <button class="ajustes-btn" id="btnAjustes" title="Tu nombre, micrófonos, quién redacta y dónde se guarda todo (⌘,)">Ajustes</button>
  </aside>

  <main class="panel">
    <div class="cabecera">
      <div class="fila">
        <div class="quien">
          <div class="titulo-fila">
            <h2 id="titulo">Elige un cliente</h2>
            <div class="mas" id="menuCliente">
              <button class="btn chico" id="btnCliente" disabled aria-haspopup="true" title="Preparar, historial e importar">Cliente ▾</button>
              <div class="menu" hidden>
                <button class="item" id="btnPreparar" title="Qué está pendiente y qué preguntar, antes de entrar">Preparar la reunión<kbd>⇧⌘P</kbd></button>
                <button class="item" id="btnExpediente" title="Todas las minutas del cliente en un solo PDF, con sus compromisos">Historial en PDF<kbd>⇧⌘E</kbd></button>
                <button class="item" id="btnImportar" title="Una grabación que ya tienes: se transcribe y se redacta la minuta">Importar un audio…<kbd>⌘O</kbd></button>
              </div>
            </div>
          </div>
          <div class="cabecera-sub" id="subtitulo">Sus reuniones aparecen aquí</div>
        </div>
        <div class="acciones">
          <div class="modo" id="modoGrabacion">
            <button class="modo-op activa" data-modo="llamada">Llamada en el Mac</button>
            <button class="modo-op" data-modo="presencial">Presencial</button>
          </div>
          <button class="btn primario" id="btnGrabar" disabled title="También con ⌘⇧R desde cualquier app">Grabar reunión</button>
        </div>
      </div>
    </div>

    <div id="barraEstado"></div>

    <div class="cuerpo">
      <div class="detalle" id="detalle">
        <div class="vacio">
          <strong>Nada seleccionado</strong>
          Elige un cliente a la izquierda y graba una reunión,<br>o importa un audio que ya tengas.
          <div class="atajo">¿Primera vez? <button class="enlazar" id="btnEjemplo" type="button">Prueba con una reunión de ejemplo</button></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="modalAjustes" role="dialog" aria-modal="true" aria-labelledby="tituloAjustes" hidden>
  <div class="modal-caja">
    <div class="modal-cab">
      <h2 id="tituloAjustes">Ajustes</h2>
      <button class="btn" id="cerrarAjustes">Cerrar</button>
    </div>
    <div class="modal-cuerpo" id="cuerpoAjustes"></div>
  </div>
</div>
<script src="../lib/md.js"></script>
<script src="ajustes.js"></script>
<script src="app.js"></script>
</body>
</html>
